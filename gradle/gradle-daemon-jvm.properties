# Daemon JVM criteria. VERSION ONLY — deliberately no toolchainVendor (D79).
#
# This file was originally generated by `updateDaemonJvm`, which captured the
# vendor of whatever JVM happened to be current at the time: JetBrains, because
# the generating machine builds through Android Studio's bundled JBR. That was
# never a decision, and it made the first CI run impossible to pass:
#
#   Unable to download toolchain matching the requirements
#   ({languageVersion=21, vendor=JetBrains, ...}) from 'null', due to:
#   No defined toolchain download url for LINUX on x86_64 architecture.
#
# Daemon-JVM provisioning is NOT the foojay path. `foojay-resolver-convention`
# in settings.gradle.kts resolves ordinary Java toolchains; the daemon criteria
# goes through DaemonJavaToolchainProvisioningService, which only knows the
# explicit `toolchainUrl.<OS>.<ARCH>` entries in this file. There are none, so
# it had nothing to download and no JBR on the runner to detect.
#
# There is no build-correctness reason to demand a vendor here. JBR matters for
# RUNNING the IDE, not for building — the daemon just needs a Java 21. Pinning
# the version is what keeps local and CI honest with each other; pinning the
# vendor only forced a 60s JBR download into every CI run (D68's minute budget)
# to satisfy a line nobody chose.
#
# If a vendor pin is ever genuinely needed, it must ship WITH the matching
# toolchainUrl entries for every platform the build runs on, or with a runner
# that installs that vendor — a bare vendor line is a build that cannot start.
toolchainVersion=21
