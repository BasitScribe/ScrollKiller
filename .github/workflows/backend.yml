# Backend gates. All of them BLOCK — none is advisory.
#
# The gates are configured in backend/pyproject.toml, not here, so a developer
# and this workflow read the same settings. A gate that only exists in the
# workflow is a gate that only runs in CI, which is how "it passed locally" stops
# meaning anything (D60).
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to match local development exactly (D69). CLAUDE.md originally said
  # 3.12; it was moved to 3.13 so the gates cannot behave differently in the two
  # places they run.
  PYTHON_VERSION: "3.13"

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # --require-hashes: every package, transitive ones included, must match the
      # exact artifact hash in the lockfile. Version pins trust the index to keep
      # serving the same bytes; hashes do not.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      # Each gate is its own step so a failure names itself in the UI instead of
      # collapsing into one red "checks" box.
      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy --strict)
        run: mypy app

      # Includes the two guards that hold D60's liveness rule and D59's
      # build-independence rule. Coverage floor is enforced from pyproject.toml.
      - name: Tests + coverage floor
        run: pytest

  image:
    name: container build + scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Do not spend minutes building an image for code that failed its own tests.
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Loaded into the local daemon rather than pushed. There is no registry in
      # 3a and nothing to deploy — the point is that the image BUILDS and that
      # Trivy has something real to scan.
      - name: Build image
        run: docker build -t scrollkiller-api:${{ github.sha }} .

      # A container that declares USER but is not actually running as that user
      # is a common and completely silent misconfiguration.
      - name: Assert the image does not run as root
        run: |
          uid="$(docker run --rm scrollkiller-api:${{ github.sha }} id -u)"
          echo "container UID: $uid"
          test "$uid" = "10001"

      # POSTURE, recorded so it is a decision rather than a default (D60):
      # fail on HIGH/CRITICAL that HAVE a fix, report everything else. A scanner
      # whose failures are ignored is worse than no scanner — it manufactures the
      # feeling of coverage. `ignore-unfixed` keeps the gate actionable: a
      # CRITICAL with no upstream patch is not something this build can fix, and
      # blocking on it just trains people to add ignore entries.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: scrollkiller-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Filesystem scan catches what an image scan cannot: a vulnerable pin in a
      # lockfile that has not reached the runtime layer.
      - name: Scan dependencies (Trivy filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # An SBOM you cannot produce for last month's build is not an SBOM. Retained
      # as an artifact so "what was in the image on the day X shipped" is
      # answerable after the fact, which is the only time anyone ever asks.
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: scrollkiller-api:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: scrollkiller-api-sbom.cyclonedx.json
          output-file: scrollkiller-api-sbom.cyclonedx.json
