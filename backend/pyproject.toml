# Backend tooling config. Deliberately NOT a packaging manifest — the service is
# deployed as a container, not installed as a wheel, so this file exists to hold
# the quality gates in one place where both a developer and CI read the same
# settings. A gate configured in the workflow instead of here is a gate that only
# runs in CI, which is how "it passed locally" starts meaning nothing (D60).

[project]
name = "scrollkiller-api"
version = "0.1.0"
description = "ScrollKiller backend — scoreboard only. No content data, only counts."
requires-python = ">=3.13"

# ---------------------------------------------------------------------------
# ruff — linter AND formatter, one tool, one config.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import order, so a diff never churns on it
    "B",    # flake8-bugbear — real bug shapes, not style
    "UP",   # pyupgrade — keep the syntax at the pinned Python version
    "SIM",  # flake8-simplify
    "RUF",  # ruff's own rules
    "S",    # flake8-bandit — this IS bandit's rule set, so basic SAST is on from
            # commit one. Full SAST (bandit/CodeQL) lands in 3c, when there is
            # auth and request-handling code worth analysing (D60).
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is their job. S101 is bandit's "assert used" rule, which is
# about asserts in PRODUCTION code being stripped under `python -O`.
#
# S105/S106 (hardcoded password) fired on `record.id_token = "eyJhbGciOi..."` in
# the redaction tests — a FAKE token, which is precisely what a test that proves
# tokens get redacted has to contain. The rule stays on everywhere else; the
# exemption is scoped to tests/ and to these two rules rather than switched off
# globally, because the day it fires in app/ it will be right.
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict, on app/ only. Tests are checked loosely: a strict test suite
# spends its budget annotating fixtures rather than catching anything.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest — coverage is a BLOCKING gate. The floor is set to what this skeleton
# actually achieves, so it ratchets. A floor below the real number is a floor
# that permits silent decay, which is worse than no floor because it looks like
# coverage is enforced.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # The uvicorn entry point only runs when the module is executed directly,
    # which a test never does.
    'if __name__ == "__main__":',
]
