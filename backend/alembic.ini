# Alembic configuration.
#
# ⚑ There is deliberately NO `sqlalchemy.url` here.
#
# The generated default is `driver://user:pass@localhost/dbname`, and leaving it
# in place is how a migration run ends up pointed at a placeholder: it looks like
# configuration, so it reads as intentional, and the failure it produces names a
# driver rather than a missing environment variable. `migrations/env.py` reads
# DATABASE_URL_DIRECT from the environment and refuses to run without it.
#
# A URL in this file would also be a URL in the repository, which goes public
# after launch (D68). Credentials live in the environment. See D60.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Revisions sort by filename in `versions/`, so lead with a zero-padded counter
# and keep the slug. `0002_add_family_id.py` tells a reviewer the order and the
# content; a bare hash tells them neither.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# ruff formats what Alembic generates, so an autogenerated revision does not fail
# `ruff format --check` and force a hand-tidy before it can be committed.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
