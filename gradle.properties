# Global build settings applied to every Gradle build in this project.

# Memory given to the Gradle daemon (the background build process).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent modules/tasks in parallel where possible (faster builds).
org.gradle.parallel=true

# Reuse task outputs between builds when nothing changed (faster rebuilds).
org.gradle.caching=true

# Use AndroidX (modern support libraries). Required by all current Compose libs.
android.useAndroidX=true

# Kotlin code style used by the IDE / Kotlin tooling.
kotlin.code.style=official

# Only generate the R (resources) fields each module actually uses — smaller, faster.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
